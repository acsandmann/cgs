[package]
name = "cgs"
version = "0.3.15"
description = "a ui library for macos built on appkit"
license = "GPL-3.0"
edition = "2024"


[dependencies]
objc2-io-surface = { version = "0.3.2", default-features = false, features = ["std", "IOSurfaceRef", "IOSurfaceTypes", "objc2-core-foundation"] }
objc2-metal = { version = "0.3.2", features = ["objc2-io-surface"] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = ["std", "SCShareableContent", "SCStream", "SCScreenshotManager", "block2", "dispatch2", "libc", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-media"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMSampleBuffer", "CMTime", "objc2-core-video"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelBufferIOSurface", "CVHostTime", "objc2-io-surface"] }
dispatch2 = { version = "0.3.0" }
objc2 = { version = "0.6.2", default-features = false, features = ["std", "exception"] }
block2 = { version = "0.6.2", default-features = false, features = ["alloc"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSString", "NSNumberFormatter", "NSProcessInfo", "NSFormatter", "NSValue", "NSKeyValueCoding", "NSNotification", "NSIndexSet", "NSURL", "NSAttributedString", "NSGeometry", "NSTimer", "NSDate"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["CFString", "CFNumber"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGContext", "CGColorSpace", "CGError", "CGGeometry", "CGWindow"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["CAMetalLayer", "CAMetalDisplayLink", "CABase", "CAFrameRateRange", "objc2-metal", "CALayer", "CATransaction", "CAAnimation", "CAMediaTiming", "CAMediaTimingFunction", "block2", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std", "NSAttributedString", "NSBezierPath", "NSParagraphStyle", "NSStringDrawing", "NSAccessibility", "NSAccessibilityProtocols", "NSAccessibilityConstants", "NSApplication", "NSAnimation", "NSAnimationContext", "NSRunningApplication", "NSAppearance", "NSWindow", "NSPanel", "NSScreen", "NSView", "NSViewController", "NSLayoutAnchor", "NSLayoutGuide", "NSLayoutConstraint", "NSStackView", "NSGridView", "NSScrollView", "NSClipView", "NSScroller", "NSSplitView", "NSSplitViewController", "NSSplitViewItem", "NSBox", "NSVisualEffectView", "NSGlassEffectView", "NSControl", "NSCell", "NSActionCell", "NSButton", "NSButtonCell", "NSSwitch", "NSSegmentedControl", "NSSegmentedCell", "NSPopUpButton", "NSPopUpButtonCell", "NSComboBox", "NSTextField", "NSTextFieldCell", "NSText", "NSTextView", "NSTextContainer", "NSSearchField", "NSTokenField", "NSHapticFeedback", "NSSlider", "NSSliderCell", "NSStepper", "NSColor", "NSColorSpace", "NSColorWell", "NSFont", "NSFontDescriptor", "NSImage", "NSImageRep", "NSImageView", "NSMenu", "NSMenuItem", "NSMenuItemBadge", "NSMenuItemCell", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSTableView", "NSTableColumn", "NSTableHeaderView", "NSTableCellView", "NSOutlineView", "NSDragging", "NSDraggingSession", "NSPasteboard", "NSPasteboardItem", "NSPopover", "NSAlert", "NSOpenPanel", "NSSavePanel", "NSToolbar", "NSToolbarItem", "NSToolbarItemGroup", "NSSearchToolbarItem", "NSMenuToolbarItem", "NSProgressIndicator", "NSEvent", "NSTrackingArea", "NSResponder", "NSGraphicsContext", "NSGraphics", "NSUserInterfaceLayout", "NSUserInterfaceValidation", "NSUserInterfaceItemIdentification", "NSWorkspace", "block2", "objc2-core-foundation", "objc2-core-graphics", "objc2-quartz-core"
] }
tracing = { version = "0.1.40", default-features = false }

[[test]]
name = "native"
harness = false

[dev-dependencies]
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGWindow", "CGEvent", "CGEventTypes", "CGDirectDisplay"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["CFDictionary", "CFNumber"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSDraggingItem", "libc"] }

[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[[example]]
name = "metal_preview"

[[test]]
name = "metal_preview"
harness = false
